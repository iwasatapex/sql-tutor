name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Validate
        run: |
          python -m compileall -q src
          python -m ruff check .
          python -m mypy
          python -m pytest -q
          python -m pytest --cov=sql_tutor --cov-report=term-missing --cov-fail-under=80 -q
          git diff --check
